name: CI
#upar humne pipeline ka naam de diya
#ab neeche is section me humne ye likha hai ki ci pipleine ko kis action pe trigger krna hai
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'helm/**'

#now we will define the jobs that will run in this pipeline...iske andar vo stages aayengi jaise build, static code analysis etc

jobs:

  build:
    runs-on: ubuntu-latest #yahan hume koi vm ya container dena hota hai jispe ye stage chalegi...hum apna runner bhi de sakte hain ya phir github ko bol sakte hain ki vo khud ka apna runner use kr le...yahan filhal humne ye bola hai ki apna runner use kr le with ubuntu latest image

    steps:
      - name: Checkout repository #yahan source code checkout hota hai 
        uses: actions/checkout@v4

      - name: Set up Go 1.22 #install go lang
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build #run build command to build the go application
        run: go build -o go-web-app

      - name: Test #run unit tests for the go application
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest #ye image to har stage me batani hi padegi ki konse runner pe run krni hai ye stage

    steps:
      - name: Checkout repository #checkout the source code 
        uses: actions/checkout@v4

      - name: Run goglangci-lint #run golangci-lint to check code quality
        uses: golangci/golangci-lint-action@v6  
        with:
          version: v1.64

#ab hogi docker image build and push stage...iske andar hum docker image build karenge aur docker hub pe push karenge
  docker-build-and-push:
    runs-on: ubuntu-latest

    needs: build #ye stage build stage ke baad hi run hogi...iske liye humne needs keyword use kiya hai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx #setup Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub #docker hub me login karne ke liye ye step hai
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} #docker hub ka username jo humne github secrets me store kiya hai...password yahin dena safe nhi hai to hum apni repo ki settings me jaake secrets me docker hub ka username aur password store karenge aur yahan use karenge
          password: ${{ secrets.DOCKER_TOKEN }} #docker hub ka password jo humne github secrets me store kiya hai...

      - name: Build and push action #docker image build and push command
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}
          #ye build and push action section ka mtlb ye hai ki whenever hum is stage ko run karenge to ye docker image build karega aur docker hub pe push karega with the tag as github run id...
          #ye tag kuch is tarah hoga ki sabse pehle isme mere dockerhub ka username aayega...phir iske baad go-web-app ye image ka naam aayega
          #run id me aayega -> jab bhi action(mtlb pipeline run hogi/mtlb commit kiya jaayega) perform hoga....to us action ki ek new docker image create hogi aur uska tag hoga run id...ye run id hamesha unique create hota hai
          #agar 100 commits hote hain to 100 docker images create hongi with 100 different tags...ye tag unique honge...aur they are pushed to docker hub with github.run_id

          #ab hoga helm update stage...iske andar hum helm chart update karenge
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: docker-build-and-push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }} # neeche values.yaml file ko github repo me commit krne ke liye hume github token ki zarurat padegi...ise humne github secrets me store kiya hai aur yahan use karenge...iske liye apni github settings me developer settings me jaake personal access token me classic tokens and then generate new token pe click karke token then select classic and then note me kuch bhi naam dede and neeche permissions provide kr do...then generate and copy the token and then go to your repo settings and then secrets and then actions and then new repository secret and then give the name as TOKEN and paste the token in the secret field and then click on add secret

    - name: Update tag in Helm chart
      run: | #update the tag in Helm chart values.yaml file with the new tag generated from the docker build and push stage
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml  

    - name: Commit and push changes
      run: |
        git config --global user.email "abhishek@gmail.com"
        git config --global user.name "Abhishek Vermaalla"
        git add helm/go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push